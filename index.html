<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>巡邏打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
body{font-family:"Microsoft JhengHei",Arial,sans-serif;margin:0;background:#f4f6f8;color:#111}
header{background:#1f2937;color:white;padding:16px}
main{max-width:920px;margin:auto;padding:14px}
.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
select,button,input{font-size:18px;padding:12px;border-radius:10px;border:1px solid #bbb;width:100%;box-sizing:border-box;margin:6px 0}
button{background:#2563eb;color:white;border:0;font-weight:bold}
button.gray{background:#64748b}
.ok{color:#15803d;font-weight:bold}.bad{color:#b91c1c;font-weight:bold}
table{width:100%;border-collapse:collapse;background:white}
th,td{border:1px solid #ddd;padding:8px;font-size:14px}
th{background:#e5e7eb}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.qrwrap{display:flex;gap:16px;flex-wrap:wrap}
.qrbox{border:1px solid #ddd;border-radius:12px;padding:14px;text-align:center;background:#fff}
.qrbox canvas{width:200px!important;height:200px!important}
@media(max-width:700px){.row{grid-template-columns:1fr}}
@page{
  size:A4 portrait;
  margin:2mm;
}

@media print{
  header,
  #checkin,
  .no-print,
  button,
  input,
  select{
    display:none!important;
  }

  body{
    background:white;
    margin:0;
  }

  main{
    max-width:none;
    width:100%;
    padding:0;
  }

  .card{
    box-shadow:none;
    border:none;
    margin:0;
    padding:0;
  }

  h3{
    display:none;
  }

  h2{
    font-size:20px;
    margin:0 0 6px 0;
    line-height:1.15;
  }

  #summary{
    font-size:14px;
    margin:3px 0 6px 0;
  }

  table{
    width:100%;
    min-width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }

  th:nth-child(1),td:nth-child(1){width:12%}
  th:nth-child(2),td:nth-child(2){width:34%}
  th:nth-child(3),td:nth-child(3){width:27%}
  th:nth-child(4),td:nth-child(4){width:27%}

  th,td{
    padding:0;
    font-size:14px;
    text-align:center;
    line-height:1.35;
    height:21px;
    vertical-align:middle;
  }

  .name{
    font-size:14px;
    font-weight:bold;
    display:inline;
    line-height:1.25;
  }

  .clock{
    font-size:14px;
    display:inline;
    line-height:1.25;
    margin-left:4px;
  }
}
</style>
</head>
<body>
<header>
  <h2>巡邏打卡系統</h2>
  <div>自動上傳 Google 試算表｜消防室 / 發電機室｜月報表列印</div>
</header>

<main>
  <div class="card" id="checkin">
    <h3>手機打卡</h3>

    <label>姓名</label>
    <select id="guard">
      <option>徐美鈴</option>
      <option>黃秋媚</option>
      <option>張凱閏</option>
      <option>支援</option>
    </select>

    <label>巡邏點</label>
    <select id="point">
      <option>消防室</option>
      <option>發電機室</option>
    </select>

    <button onclick="checkIn()">立即打卡上傳</button>
    <p id="msg"></p>
  </div>

  <div class="card no-print">
    <h3>巡邏點 QR Code</h3>
    <p>列印後貼在現場。手機掃 QR 後會自動帶入巡邏點，再選姓名打卡。</p>
    <button class="gray" onclick="window.print()">列印 QR Code / 報表</button>
    <div class="qrwrap" id="qrs"></div>
  </div>

  <div class="card">
    <h3>月報表</h3>
    <div class="row no-print">
      <div>
        <label>月份</label>
        <input type="month" id="month">
      </div>
      <div>
        <label>班別</label>
        <select id="shift">
          <option value="">全部班別</option>
          <option value="早班">早班 07:00~15:00</option>
          <option value="中班">中班 15:00~23:00</option>
          <option value="大夜班">大夜班 23:00~07:00</option>
        </select>
      </div>
      <div>
        <label>姓名</label>
        <select id="guardFilter">
          <option value="">全部人員</option>
          <option>徐美鈴</option>
          <option>黃秋媚</option>
          <option>張凱閏</option>
          <option>支援</option>
        </select>
      </div>
    </div>

    <button class="no-print" onclick="loadReport()">查詢月報表</button>
    <button class="gray no-print" onclick="window.print()">列印月報表</button>

    <h2 id="title">巡邏月報表</h2>
    <p id="summary"></p>
    <table>
      <thead>
        <tr><th>日期</th><th>時間</th><th>班別</th><th>姓名</th><th>巡邏點</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzFheuZ1i-5pLadQaC63-ChmTTqM_2Rz1BhI0fL_6dvOcSmIMMaL_yg6iu34Nv42nBa/exec";
const $ = id => document.getElementById(id);
const POINTS = ["消防室","發電機室"];
let reportData = [];

function pad(n){ return String(n).padStart(2,"0"); }

window.onload = () => {
  const now = new Date();
  $("month").value = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;

  const params = new URLSearchParams(location.search);
  const point = params.get("point");
  if(point && POINTS.includes(point)) $("point").value = point;

  makeQRCodes();
};

function getShift(date){
  const h = date.getHours();
  if(h >= 7 && h < 15) return "早班";
  if(h >= 15 && h < 23) return "中班";
  return "大夜班";
}

function localDateTime(d){
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

async function checkIn(){
  const guard = $("guard").value;
  const point = $("point").value;
  const now = new Date();

  const data = {
    isoTime: now.toISOString(),
    time: localDateTime(now),
    date: `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}`,
    clock: `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`,
    shift: getShift(now),
    guard,
    point
  };

  $("msg").textContent = "上傳中...";
  try {
    const r = await fetch(API_URL, {
      method:"POST",
      mode:"cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(data)
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || "上傳失敗");
    $("msg").innerHTML = `<span class="ok">打卡成功：${data.time}｜${data.shift}｜${guard}｜${point}</span>`;
  } catch(e) {
    $("msg").innerHTML = `<span class="bad">打卡失敗：${e.message}</span>`;
  }
}

async function loadReport(){
  const month = $("month").value;
  const shift = $("shift").value;
  const guard = $("guardFilter").value;

  $("summary").textContent = "讀取中...";
  try {
    const url = `${API_URL}?action=list&month=${encodeURIComponent(month)}&shift=${encodeURIComponent(shift)}`;
    const r = await fetch(url);
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || "讀取失敗");

    reportData = j.records || [];
    if(guard) reportData = reportData.filter(x => x.guard === guard);
    render();
  } catch(e) {
    $("summary").innerHTML = `<span class="bad">讀取失敗：${e.message}</span>`;
  }
}

function render(){
  const month = $("month").value;
  const shift = $("shift").value || "全部班別";
  const guard = $("guardFilter").value || "全部人員";

  $("title").textContent = `巡邏月報表｜${month}｜${shift}｜${guard}`;
  $("summary").textContent = `共 ${reportData.length} 筆`;

  $("tbody").innerHTML = reportData.map(x => `
    <tr>
      <td>${x.date || ""}</td>
      <td>${x.clock || ""}</td>
      <td>${x.shift || ""}</td>
      <td>${x.guard || ""}</td>
      <td>${x.point || ""}</td>
    </tr>
  `).join("");
}

function makeQRCodes(){
  const container = $("qrs");
  container.innerHTML = "";
  const base = location.href.split("?")[0].split("#")[0];

  POINTS.forEach(point => {
    const url = `${base}?point=${encodeURIComponent(point)}`;
    const box = document.createElement("div");
    box.className = "qrbox";
    box.innerHTML = `<h2>${point}</h2><canvas></canvas><p>掃描後自動帶入：${point}</p>`;
    container.appendChild(box);
    QRCode.toCanvas(box.querySelector("canvas"), url, {width:220, margin:2});
  });
}
</script>
</body>
</html>
